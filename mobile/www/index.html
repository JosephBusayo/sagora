<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>No connection · Sagora</title>
<style>
  /* Everything here is local on purpose: this is the page shown when the phone cannot reach
     anything, so a web font or a hosted stylesheet would simply never arrive. */
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    background: #f7f8f2; color: #20201e;
    font: 500 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .card { width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  img { width: 128px; height: auto; }
  h1 { margin: 10px 0 0; font-size: 20px; line-height: 1.3; letter-spacing: -0.4px; }
  p { margin: 0; color: #7e8074; }
  button {
    margin-top: 8px; width: 100%; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px;
    background: #024321; color: #cee06a; font: 500 16px/1 inherit; cursor: pointer;
  }
  button:active { background: #035a2c; }
</style>
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="Sagora" />
    <h1>You are not connected</h1>
    <p>Sagora needs the internet to show your requests and quotes. Check your data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.replace('https://www.sagora.sl/')">Try again</button>
  </main>
</body>
</html>
